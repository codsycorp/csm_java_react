    server {
        listen 80;
        listen [::]:80;

        # We want SSL for this server so http:// and https:// work the same for these server_name’s
        listen       443 ssl http2;
        listen       [::]:443 ssl http2; 
        server_name  phanmem.vn369.net;
        charset utf-8;
        client_max_body_size 1G;
        root         /root/la_php_server/;

        ssl_certificate /etc/letsencrypt/live/www.vn369.net-0001/fullchain.pem; # managed by Certbot
		ssl_certificate_key /etc/letsencrypt/live/www.vn369.net-0001/privkey.pem; # managed by Certbot
		include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
		ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

        # Load configuration files for the default server block.
        include snippets/fastcgi-php.conf;
        rewrite ^/(.*)\.shtml$ /main.php?$1 last;
        location / {
            try_files $uri /index.php$is_args$args;
        }
        location ~ \.php$ {

            fastcgi_connect_timeout 60;
            fastcgi_send_timeout 180;
            fastcgi_read_timeout 180;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 256 16k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_temp_file_write_size 256k;
            fastcgi_max_temp_file_size 0;
			# With php-fpm (or other unix sockets):
			fastcgi_pass unix:/var/run/php/php5.6-fpm.sock;
            # fastcgi_pass   127.0.0.1:9000;
            #fastcgi_read_timeout 200;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
        location ~* \.(eot|ttf|woff|woff2|docx)$ {
            add_header Access-Control-Allow-Origin *;
        }
    }

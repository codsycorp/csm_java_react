# CSM AI Local — Profile: local-8gb (production Linux ~8GB RAM, 4 CPU)
# Single worker: qwen2.5-coder-1.5b-instruct-q8_0.gguf (~1.6GB RAM)
# Launch: ./run-server.sh  OR  SPRING_PROFILES_ACTIVE=prod,local-8gb
# Model: ./scripts/download-ai-local-models.sh 8gb

ai.local.runtime.tier=balanced-8gb
ai.local.only.enabled=true
ai.local.llama.prefer-local-first=true

ai.local.llama.runtime-profile=balanced
ai.local.llama.context-window=4096
ai.local.llama.context-window-hard-cap=4096
ai.local.llama.context-window-auto-fit=true
ai.local.llama.max-tokens=768
ai.local.llama.max-prompt-chars=16000
ai.local.llama.threads=3
ai.local.llama.batch-size=64
ai.local.llama.ubatch-size=32
ai.local.llama.max-concurrent-requests=1
ai.local.llama.preload-on-startup=false
ai.local.llama.load-shed.enabled=true
ai.local.llama.load-shed.min-free-heap-mb=384
ai.local.llama.inter-request-cooldown-ms=900
ai.local.llama.force-single-thread-on-weak=false
ai.local.llama.native.skip-warmup=true
ai.local.llama.native.disable-fit=false
ai.local.llama.unload-after-idle-ms=180000
ai.local.llama.model-path=./csm_datas/ai_local/model/qwen2.5-coder-1.5b-instruct-q8_0.gguf
ai.local.llama.seo-model-path=./csm_datas/ai_local/model/qwen2.5-coder-1.5b-instruct-q8_0.gguf
ai.local.llama.swap-models-on-lane-change=false
ai.seo.article.max-tokens=2048
ai.seo.locale-translate.max-tokens=1024
ai.seo.article.target-words-vi=600-900

ai.embedding.provider=hash
ai.embedding.llama.enabled=false
ai.embedding.hash.dimensions=128
ai.embedding.hash.fallback-enabled=true

ai.local.prompt.composition.mode=auto
ai.local.prompt.composition.auto-orchestration-max-chars=22000
ai.local.prompt.composition.orchestration-digest-max-chars=1600
ai.local.prompt.composition.orchestration-memory-max-chars=1200
ai.local.prompt.slot.active-editor-chars=22000
ai.local.prompt.slot.rag-context-chars=5000
ai.local.prompt.slot.memory-chars=1200
ai.local.prompt.slot.user-request-chars=4000
ai.local.runtime.weak-profile.local-provider.max-prompt-chars=32000
ai.assistant.prompt-budget.code.max-chars=48000
ai.assistant.prompt-budget.code-analyze.current-code-max-chars=28000
ai.assistant.local-provider.max-payload-chars=52000
ai.code-stream.local-provider.max-prompt-chars=48000
ai.code-stream.max-prompt-chars=52000

ai.orchestration.agentic.enabled=true
ai.orchestration.agentic.max-context-chars=14000
ai.orchestration.speculative.enabled=false
ai.orchestration.multimodal.scope-rag.enabled=true
ai.orchestration.multimodal.scope-rag.top-k=5
ai.orchestration.multimodal.scope-rag.max-chars=5000
ai.local.orchestration.evidence-refine.enabled=false
ai.local.intent-classify.second-pass.enabled=true
ai.local.analyze.low-confidence-retry.enabled=true
ai.local.analyze.broad-gap-fill.enabled=true
ai.local.business-comprehension.comprehend-max-tokens=1024
ai.local.business-comprehension.worker-max-tokens=2048
ai.local.business-comprehension.heuristic-fallback.enabled=false

ai.local.chunking.enabled=true
ai.local.chunking.threshold-chars=60000
ai.local.chunking.chunk-size-chars=6000
ai.local.chunking.max-chunks=8

ai.local.final-output-gate.enabled=true
ai.local.final-output-gate.code-edit.enabled=true
ai.local.final-output-gate.menu-json.enabled=true
ai.edit.local.symbol-micro-first.enabled=true
ai.edit.task-planner.multi-slice-execution.enabled=true

cache.warming.enabled=false
spring.task.scheduling.pool.size=2
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=6
ai.code-stream.sse-timeout.adaptive.weak-server-force-infinite=true

ai.media.render.enabled=false
ai.media.character.enabled=false

ai.guest-chat.enabled=true
ai.guest-chat.max-concurrent=1
ai.guest-chat.max-output-tokens=128
ai.guest-chat.per-guest-cooldown-ms=45000
ai.guest-chat.skip-when-worker-busy=true
ai.guest-chat.min-free-heap-mb=320

ai.local.greenfield.enabled=true
ai.local.greenfield.menu-module-enrich.enabled=true
ai.local.greenfield.menu-module-enrich.max-tokens=512

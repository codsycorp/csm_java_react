name: Build and Deploy to Linux Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run remote deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # optional: known_hosts to verify server fingerprint
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          script: |
            set -e
            # adjust REMOTE_DIR to your repo path on the server
            REMOTE_DIR=${{ secrets.REMOTE_DIR }}
            if [ -z "$REMOTE_DIR" ]; then
              echo "REMOTE_DIR not set; using home directory"
              REMOTE_DIR="$HOME"
            fi
            cd "$REMOTE_DIR"
            # ensure repository is present and updated
            if [ -d .git ]; then
              git fetch --all --prune
              git reset --hard origin/main
              git checkout main || true
            else
              # clone if missing
              git clone https://github.com/${{ github.repository }} .
            fi
            # run your server deploy/build script(s)
            # Examples (customize as needed):
            if [ -x ./deployBackend.sh ]; then
              ./deployBackend.sh || true
            fi
            if [ -x ./deploy.sh ]; then
              ./deploy.sh || true
            fi
            # restart service if you use systemd (example)
            if command -v systemctl >/dev/null 2>&1; then
              sudo systemctl restart csm-server.service || true
            fi

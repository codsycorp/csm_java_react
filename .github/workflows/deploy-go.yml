name: Build & Deploy Go Backend

on:
  push:
    branches: [main]
    paths:
      - "backend-go/**"
      - "config.env"
      - "config.local-8gb.env"
      - ".github/workflows/deploy-go.yml"
  workflow_dispatch:
    inputs:
      build_native:
        description: "Build with -tags llamacpp (CGO, slower; needs gcc on runner)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEPLOY_PATH: /root/la_server
  BINARY_NAME: csm_go_server

jobs:
  build-and-deploy:
    name: Build Go → Deploy → Restart csm-go
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Install native build deps (llamacpp only)
        if: github.event.inputs.build_native == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Build release binary
        working-directory: backend-go
        env:
          CGO_ENABLED: ${{ github.event.inputs.build_native == 'true' && '1' || '0' }}
          GOOS: linux
          GOARCH: amd64
          BUILD_TAGS: ${{ github.event.inputs.build_native == 'true' && 'llamacpp' || '' }}
        run: |
          OUT="../${{ env.BINARY_NAME }}"
          TAGS=""
          if [ -n "$BUILD_TAGS" ]; then
            TAGS="-tags $BUILD_TAGS"
          fi
          echo "CGO_ENABLED=$CGO_ENABLED tags=$BUILD_TAGS"
          go build $TAGS -ldflags="-s -w" -trimpath -o "$OUT" ./cmd/server
          ls -lh "$OUT"
          file "$OUT"
          if [ "$CGO_ENABLED" = "0" ]; then
            ldd "$OUT" && exit 1 || echo "Static binary OK"
          else
            ldd "$OUT" || true
          fi

      - name: Upload binary to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: "${{ env.BINARY_NAME }}"
          target: "${{ env.DEPLOY_PATH }}/"
          strip_components: 0

      - name: Deploy & restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            P="${{ env.DEPLOY_PATH }}"
            BIN="$P/${{ env.BINARY_NAME }}"
            chmod +x "$BIN"

            mkdir -p "$P/csm_datas/native/pebble" \
                     "$P/csm_datas/native/search" \
                     "$P/csm_datas/database" \
                     "$P/csm_datas/backups" \
                     "$P/csm_datas/ai_local/model"

            NATIVE="${{ github.event.inputs.build_native }}"
            if [ "$NATIVE" = "true" ]; then
              AI_NATIVE=true
              AI_PRELOAD=false
            else
              AI_NATIVE=false
              AI_PRELOAD=false
            fi

            cat > /etc/systemd/system/csm-go.service << SVCEOF
            [Unit]
            Description=CSM Go Backend
            After=network.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=$P
            EnvironmentFile=$P/config.env
            EnvironmentFile=-$P/config.local-8gb.env
            Environment=CSM_HOME=$P
            Environment=CSM_LOCAL_PROFILE=8gb
            Environment=APP_DATA_DIR=$P/csm_datas
            Environment=CSM_NATIVE_DATA_DIR=$P/csm_datas/native
            Environment=CSM_PEBBLE_ROOT=$P/csm_datas/native/pebble
            Environment=CSM_SEARCH_DB_PATH=$P/csm_datas/native/search/vectors.db
            Environment=ROCKSDB_ROOT_DIR=$P/csm_datas/database
            Environment=LUCENE_INDEX_ROOT_DIR=$P/csm_datas/lucene_index
            Environment=SERVER_PORT=9999
            Environment=SOCKET_SERVER_PORT=15301
            Environment=REDIS_ENABLED=0
            Environment=CSM_SKIP_STARTUP_DB_INIT=1
            Environment=AI_LOCAL_LLAMA_NATIVE_ENABLED=$AI_NATIVE
            Environment=AI_LOCAL_LLAMA_GPU_LAYERS=0
            Environment=AI_LOCAL_LLAMA_PRELOAD_ON_STARTUP=$AI_PRELOAD
            ExecStart=$BIN
            Restart=always
            RestartSec=5
            MemoryMax=7G
            LimitNOFILE=65536
            StandardOutput=journal
            StandardError=journal

            [Install]
            WantedBy=multi-user.target
            SVCEOF

            systemctl daemon-reload
            systemctl stop csm-rust 2>/dev/null || true
            systemctl disable csm-rust 2>/dev/null || true
            systemctl enable csm-go
            systemctl restart csm-go
            sleep 5

            echo "=== PORTS ==="
            ss -tlnp | grep -E ':9999|:15301' || true

            echo "=== STATUS ==="
            systemctl status csm-go --no-pager || true

            echo "=== HEALTH ==="
            curl -sf "http://127.0.0.1:9999/api/monitoring/health" || true
            echo

            echo "=== SOCKET.IO ==="
            curl -sf "http://127.0.0.1:15301/socket.io/?EIO=4&transport=polling" | head -c 120 || true
            echo

            echo "=== LOG ==="
            journalctl -u csm-go -n 30 --no-pager || true

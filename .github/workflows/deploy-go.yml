name: Build & Deploy Go Backend

on:
  push:
    branches: [main]
    paths:
      - "backend-go/**"
      - "config.env"
      - "config.local-8gb.env"
      - "scripts/build-go-linux.sh"
      - "scripts/fetch-llama-server-linux.sh"
      - ".github/workflows/deploy-go.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEPLOY_PATH: /root/la_server
  BINARY_NAME: csm_go_server

jobs:
  build:
    name: Build linux artifacts (CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod

      - name: Build csm_go_server (linux/amd64 static)
        run: |
          chmod +x scripts/build-go-linux.sh scripts/fetch-llama-server-linux.sh
          mkdir -p dist
          ./scripts/build-go-linux.sh dist/csm_go_server

      - name: Fetch llama-server (linux/amd64, Ubuntu 20.04 compatible)
        run: |
          ./scripts/fetch-llama-server-linux.sh dist/llama-server

      - name: Verify llama-server in Ubuntu 20.04 container
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" ubuntu:20.04 /dist/llama-server --version \
            || docker run --rm -v "$PWD/dist:/dist:ro" ubuntu:20.04 /dist/llama-server --help

      - uses: actions/upload-artifact@v4
        with:
          name: csm-go-release
          path: |
            dist/csm_go_server
            dist/llama-server
          retention-days: 7

  deploy:
    name: Upload artifacts → restart csm-go (no build on server)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: csm-go-release
          path: dist

      - name: Upload binaries to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: "dist/csm_go_server,dist/llama-server"
          target: /tmp/csm-go-release
          strip_components: 1

      - name: Install & restart (SSH only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          command_timeout: 15m
          script: |
            set -e
            P="${{ env.DEPLOY_PATH }}"
            BIN="$P/${{ env.BINARY_NAME }}"
            LLAMA_BIN="$P/csm_datas/bin/llama-server"

            mkdir -p "$P/csm_datas/bin" \
                     "$P/csm_datas/native/pebble" \
                     "$P/csm_datas/native/search" \
                     "$P/csm_datas/database" \
                     "$P/csm_datas/backups" \
                     "$P/csm_datas/ai_local/model"

            install -m755 /tmp/csm-go-release/csm_go_server "$BIN"
            install -m755 /tmp/csm-go-release/llama-server "$LLAMA_BIN"
            rm -rf /tmp/csm-go-release
            ls -lh "$BIN" "$LLAMA_BIN"
            file "$BIN" "$LLAMA_BIN"

            systemctl stop csm-llama 2>/dev/null || true
            systemctl disable csm-llama 2>/dev/null || true

            cat > /etc/systemd/system/csm-go.service <<SVCEOF
            [Unit]
            Description=CSM Go Backend
            After=network.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=$P
            EnvironmentFile=$P/config.env
            EnvironmentFile=-$P/config.local-8gb.env
            Environment=CSM_HOME=$P
            Environment=CSM_LOCAL_PROFILE=8gb
            Environment=APP_DATA_DIR=$P/csm_datas
            Environment=CSM_NATIVE_DATA_DIR=$P/csm_datas/native
            Environment=CSM_PEBBLE_ROOT=$P/csm_datas/native/pebble
            Environment=CSM_SEARCH_DB_PATH=$P/csm_datas/native/search/vectors.db
            Environment=ROCKSDB_ROOT_DIR=$P/csm_datas/database
            Environment=LUCENE_INDEX_ROOT_DIR=$P/csm_datas/lucene_index
            Environment=SERVER_PORT=9999
            Environment=SOCKET_SERVER_PORT=15301
            Environment=REDIS_ENABLED=0
            Environment=CSM_SKIP_STARTUP_DB_INIT=1
            Environment=AI_LOCAL_LLAMA_NATIVE_ENABLED=false
            Environment=AI_LOCAL_LLAMA_MANAGED_SIDECAR=true
            Environment=AI_LOCAL_LLAMA_SKIP_BOOTSTRAP=true
            Environment=AI_LOCAL_LLAMA_ALLOW_SOURCE_BUILD=false
            Environment=AI_LOCAL_LLAMA_SERVER_BIN=$LLAMA_BIN
            Environment=AI_LOCAL_LLAMA_SERVER_URL=http://127.0.0.1:8888
            Environment=AI_LOCAL_LLAMA_GPU_LAYERS=0
            Environment=AI_LOCAL_LLAMA_PRELOAD_ON_STARTUP=false
            ExecStart=$BIN
            Restart=always
            RestartSec=5
            MemoryMax=7800M
            LimitNOFILE=65536
            StandardOutput=journal
            StandardError=journal

            [Install]
            WantedBy=multi-user.target
            SVCEOF

            systemctl daemon-reload
            systemctl stop csm-rust 2>/dev/null || true
            systemctl disable csm-rust 2>/dev/null || true
            systemctl enable csm-go
            systemctl restart csm-go

            echo "Waiting for AI local (load 7B model ~2-6 min)..."
            AI_OK=false
            for i in $(seq 1 180); do
              AI_HEALTH="$(curl -sf "http://127.0.0.1:9999/api/ai-local/health" 2>/dev/null || true)"
              if echo "$AI_HEALTH" | grep -q '"available":true'; then
                AI_OK=true
                break
              fi
              sleep 2
            done

            echo "=== PORTS ==="
            ss -tlnp | grep -E ':9999|:15301|:8888' || true
            systemctl status csm-go --no-pager || true
            curl -sf "http://127.0.0.1:9999/api/monitoring/health" || true
            echo
            curl -sf "http://127.0.0.1:9999/api/ai-local/health" || true
            echo
            if [ "$AI_OK" != "true" ]; then
              journalctl -u csm-go -n 60 --no-pager | grep -E 'LlamaManaged|llama-server' || true
            fi

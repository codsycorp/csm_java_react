name: Build & Deploy Rust Backend

on:
  push:
    branches: [main]
    paths:
      - "backend-rust/**"
      - ".github/workflows/deploy-rust.yml"
  workflow_dispatch:  # cho phép chạy thủ công từ GitHub UI

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-deploy:
    name: Build (Ubuntu) → Deploy → Restart
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Install Rust toolchain ─────────────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ── 3. Cache (build lần sau ~2-3 phút thay vì 15-20 phút) ───────────────
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rust

      # ── 4. Install system deps (llama.cpp, RocksDB cần cmake + clang) ────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libclang-dev clang \
            libssl-dev libzstd-dev libbz2-dev liblz4-dev libsnappy-dev

      # ── 5. Build ─────────────────────────────────────────────────────────────
      - name: Build release-server
        working-directory: backend-rust
        run: |
          cargo build --profile release-server
          ls -lh target/release-server/csm_server

      # ── 6. Upload binary lên server ──────────────────────────────────────────
      - name: Upload binary to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: "backend-rust/target/release-server/csm_server"
          target: "/root/csm_server_new/"
          strip_components: 3

      # ── 7. Swap binary + restart service ─────────────────────────────────────
      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            mkdir -p /root/csm_server/backend-rust/target/release
            mv /root/csm_server_new/csm_server /root/csm_server/backend-rust/target/release/csm_server
            chmod +x /root/csm_server/backend-rust/target/release/csm_server
            systemctl restart csm-rust
            sleep 3
            systemctl status csm-rust --no-pager | head -10

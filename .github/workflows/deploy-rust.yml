name: Build & Deploy Rust Backend

on:
  push:
    branches: [main]
    paths:
      - "backend-rust/**"
      - ".github/workflows/deploy-rust.yml"
  workflow_dispatch:  # cho phép chạy thủ công từ GitHub UI

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build (Ubuntu) → Deploy → Restart
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Install Rust toolchain ─────────────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ── 3. Cache (build lần sau ~2-3 phút thay vì 15-20 phút) ───────────────
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rust

      # ── 4. Install system deps (llama.cpp, RocksDB cần cmake + clang) ────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libclang-dev clang \
            libssl-dev libzstd-dev libbz2-dev liblz4-dev libsnappy-dev

      # ── 5. Build ─────────────────────────────────────────────────────────────
      - name: Build release-server
        working-directory: backend-rust
        run: |
          cargo build --profile release-server
          ls -lh target/release-server/csm_server

      # ── 6. Upload binary lên server ──────────────────────────────────────────
      - name: Upload binary to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: "backend-rust/target/release-server/csm_server"
          target: "/root/la_server/"
          strip_components: 3

      # ── 7. Swap binary + tạo service nếu chưa có + restart ──────────────────
      - name: Deploy & restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            DEPLOY_DIR=/root/la_server
            BINARY=$DEPLOY_DIR/csm_server

            chmod +x $BINARY

            # Tạo systemd service nếu chưa có
            if [ ! -f /etc/systemd/system/csm-rust.service ]; then
              echo "Tạo systemd service csm-rust..."
              cat > /etc/systemd/system/csm-rust.service <<EOF
            [Unit]
            Description=CSM Rust Backend
            After=network.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=$DEPLOY_DIR
            EnvironmentFile=$DEPLOY_DIR/config.env
            ExecStart=$BINARY
            Restart=always
            RestartSec=5
            MemoryMax=6G
            LimitNOFILE=65536
            StandardOutput=journal
            StandardError=journal

            [Install]
            WantedBy=multi-user.target
            EOF
              systemctl daemon-reload
              systemctl enable csm-rust
            fi

            systemctl restart csm-rust || true
            sleep 5
            echo "=== STATUS ==="
            systemctl status csm-rust --no-pager || true
            echo "=== LOG ==="
            journalctl -u csm-rust -n 50 --no-pager || true

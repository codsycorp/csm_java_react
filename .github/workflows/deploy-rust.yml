name: Build & Deploy Rust Backend

on:
  push:
    branches: [main]
    paths:
      - "backend-rust/**"
      - "nginx.conf"
      - ".github/workflows/deploy-rust.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-and-deploy:
    name: Build (Debian 11 / glibc 2.31) → Deploy → Restart
    runs-on: ubuntu-latest
    # rust:bullseye = Debian 11, glibc 2.31 — khớp Ubuntu 20.04 server
    # Rust + make + cmake + build tools đã có sẵn, không cần cài thêm
    container:
      image: rust:bullseye

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rust

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libclang-dev clang \
            libssl-dev libzstd-dev libbz2-dev liblz4-dev libsnappy-dev
          ninja --version && cmake --version

      - name: Build release-server
        working-directory: backend-rust
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          cargo build --profile release-server
          ls -lh target/release-server/csm_server
          echo "=== Shared libs required ==="
          ldd target/release-server/csm_server

      - name: Upload binary to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: "backend-rust/target/release-server/csm_server"
          target: "/root/la_server/"
          strip_components: 3

      - name: Deploy & restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            chmod +x /root/la_server/csm_server

            # Luôn ghi đè service file với path đúng
            cat > /etc/systemd/system/csm-rust.service << 'SVCEOF'
            [Unit]
            Description=CSM Rust Backend
            After=network.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=/root/la_server
            EnvironmentFile=/root/la_server/config.env
            Environment=SERVER_PORT=9999
            Environment=SOCKET_SERVER_PORT=15301
            ExecStart=/root/la_server/csm_server
            Restart=always
            RestartSec=5
            MemoryMax=6G
            LimitNOFILE=65536
            StandardOutput=journal
            StandardError=journal

            [Install]
            WantedBy=multi-user.target
            SVCEOF

            systemctl daemon-reload
            systemctl enable csm-rust
            systemctl restart csm-rust || true
            sleep 5
            echo "=== STATUS ==="
            systemctl status csm-rust --no-pager || true
            echo "=== LOG ==="
            journalctl -u csm-rust -n 30 --no-pager || true

  deploy-nginx:
    name: Deploy nginx.conf → Reload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload nginx config to /tmp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: "nginx.conf"
          target: "/tmp/"
          strip_components: 0

      - name: Upload surgical patch script to /tmp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: ".github/scripts/patch_nginx.py"
          target: "/tmp/patch_nginx.py"
          strip_components: 3

      - name: Validate, deploy & reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            echo "=== nginx version ==="
            nginx -v 2>&1

            echo "=== AI location trong config HIỆN TẠI ==="
            grep -c "ai-generate-seo-content" /etc/nginx/nginx.conf 2>/dev/null || echo "0 — chưa có"

            echo "=== Tạo include files còn thiếu ==="
            touch /etc/nginx/blocked_ips.conf
            mkdir -p /etc/nginx/snippets
            touch /etc/nginx/snippets/fastcgi-php.conf

            echo "=== Test config MỚI trước khi thay thế ==="
            FULL_OK=0
            nginx -t -c /tmp/nginx.conf 2>&1 && FULL_OK=1 || true

            if [ "$FULL_OK" = "1" ]; then
              echo "Full config PASSED — deploying"
              cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak || true
              cp /tmp/nginx.conf /etc/nginx/nginx.conf
              nginx -s reload
              echo "nginx reloaded OK với full config"
              grep -c "ai-generate-seo-content" /etc/nginx/nginx.conf
            else
              echo "Full config FAILED — chi tiết lỗi:"
              nginx -t -c /tmp/nginx.conf 2>&1 | head -30 || true

              if grep -q "location = /ai-generate-seo-content" /etc/nginx/nginx.conf; then
                echo "AI location đã có trong server config — chỉ reload"
                nginx -t && nginx -s reload
              else
                echo "Áp dụng surgical patch..."
                python3 /tmp/patch_nginx.py

                if nginx -t 2>&1; then
                  nginx -s reload
                  echo "Surgical patch + reload OK"
                  grep -n "ai-generate-seo-content" /etc/nginx/nginx.conf | head -5
                else
                  cp /etc/nginx/nginx.conf.bak /etc/nginx/nginx.conf || true
                  echo "Surgical patch cũng FAILED — restored backup"
                  nginx -t 2>&1 | head -20 || true
                  exit 1
                fi
              fi
            fi

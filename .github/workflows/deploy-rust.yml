name: Build & Deploy Rust Backend

on:
  push:
    branches: [main]
    paths:
      - "backend-rust/**"
      - ".github/workflows/deploy-rust.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-and-deploy:
    name: Build (Ubuntu 20.04) → Deploy → Restart
    runs-on: ubuntu-latest
    # Build trong container Ubuntu 20.04 → binary dùng glibc 2.31
    # tương thích server Ubuntu 20.04 (không cần glibc 2.38+)
    container:
      image: ubuntu:20.04
      options: --user root

    steps:
      - name: Install prerequisites
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            curl git ca-certificates openssh-client

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rust

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            cmake pkg-config libclang-dev clang \
            libssl-dev libzstd-dev libbz2-dev liblz4-dev libsnappy-dev

      - name: Build release-server
        working-directory: backend-rust
        run: |
          cargo build --profile release-server
          ls -lh target/release-server/csm_server
          ldd target/release-server/csm_server

      - name: Upload binary to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: "backend-rust/target/release-server/csm_server"
          target: "/root/la_server/"
          strip_components: 3

      - name: Deploy & restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            DEPLOY_DIR=/root/la_server
            BINARY=$DEPLOY_DIR/csm_server

            chmod +x $BINARY

            # Luôn ghi đè service file
            cat > /etc/systemd/system/csm-rust.service << 'SVCEOF'
            [Unit]
            Description=CSM Rust Backend
            After=network.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=/root/la_server
            EnvironmentFile=/root/la_server/config.env
            ExecStart=/root/la_server/csm_server
            Restart=always
            RestartSec=5
            MemoryMax=6G
            LimitNOFILE=65536
            StandardOutput=journal
            StandardError=journal

            [Install]
            WantedBy=multi-user.target
            SVCEOF

            systemctl daemon-reload
            systemctl enable csm-rust
            systemctl restart csm-rust || true
            sleep 5
            echo "=== STATUS ==="
            systemctl status csm-rust --no-pager || true
            echo "=== LOG ==="
            journalctl -u csm-rust -n 30 --no-pager || true

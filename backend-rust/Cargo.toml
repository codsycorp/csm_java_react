[package]
name = "csm_server"
version = "1.0.0"
edition = "2021"
description = "CSM Server — Rust backend (migrated from Spring Boot)"
authors = ["phanmemmottrieu.net"]
default-run = "csm_server"

[dependencies]
# HTTP server
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace", "limit"] }
hyper = { version = "1", features = ["full"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
futures-util = "0.3"
async-stream = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"

# Data layer
rocksdb = "0.22"
tantivy = "0.22"

# Auth & security
jsonwebtoken = "9"
bcrypt = "0.16"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

# Cache & messaging
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
rdkafka = { version = "0.36", features = ["cmake-build"], optional = true }

# HTTP client (AI gateways, scrapers)
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "cookies"] }

# Real-time chat
socketioxide = { version = "0.15", features = ["state"] }

# Media / AI sidecars
tokio-process = "0.2"

# Config & logging
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utils
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
parking_lot = "0.12"
dashmap = "6"
thiserror = "2"
anyhow = "1"
url = "2"
urlencoding = "2"
mime = "0.3"
mime_guess = "2"
rand = "0.8"
bytes = "1"
http-body-util = "0.1"
scraper = "0.22"
askama = { version = "0.12", features = ["with-axum"] }

[features]
default = []
kafka = ["rdkafka"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
